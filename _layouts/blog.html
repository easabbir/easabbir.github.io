<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved theme before first paint (same key as the home page).
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
    </script>
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="blog-page">
    <div class="theme-toggle">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="{{ '/' | relative_url }}"><h2>Ehsanul Alam Sabbir</h2></a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="{{ '/#home' | relative_url }}" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="{{ '/#about' | relative_url }}" class="nav-link">About</a></li>
                <li class="nav-item"><a href="{{ '/#experience' | relative_url }}" class="nav-link">Experience</a></li>
                <li class="nav-item"><a href="{{ '/#skills' | relative_url }}" class="nav-link">Skills</a></li>
                <li class="nav-item"><a href="{{ '/#projects' | relative_url }}" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="{{ '/blog/' | relative_url }}" class="nav-link active" aria-current="page">Blog</a></li>
                <li class="nav-item"><a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a></li>
                <li class="nav-item"><a href="{{ '/#resume' | relative_url }}" class="nav-link resume-btn">Resume</a></li>
            </ul>
            <button class="hamburger" aria-label="Open menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>

    <main class="blog-main">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{ site.time | date: '%Y' }} Ehsanul Alam Sabbir. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/ehsanul-alam-sabbir/" class="social-link" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/easabbir" class="social-link" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="{{ '/blog/feed.xml' | relative_url }}" class="social-link" aria-label="RSS feed"><i class="fas fa-rss"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
</body>
</html>
